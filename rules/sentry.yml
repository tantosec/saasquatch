version: 1
rules:
  - name: Sentry - Subdomain
    service: Sentry
    tags:
      - monitoring
      - dev
    known_good: swift-finance-ltd
    request:
      method: GET
      path: IDENTIFIER.sentry.io/auth/login/IDENTIFIER/
      port: 443
      protocol: https
    detection:
      match: { status: [200] }
    condition: match
